[pytest]
# 2026-09-13 code review — `error` turns any warning this suite doesn't already know about
# into a hard test failure, so a new warning (from our own code, or a future dependency bump)
# can never again pass silently. The two `ignore` lines below are the ONLY warnings the suite
# currently produces, both from third-party library internals we don't control (not our own
# code) -- listed AFTER `error` deliberately: pytest applies `filterwarnings` entries via
# warnings.filterwarnings(), which inserts each at the FRONT of the filter list, so entries
# listed later are checked first at runtime and correctly take precedence over the blanket
# `error` above them. If either of these libraries is ever upgraded and the warning goes away
# on its own, remove the matching line here -- don't leave a stale ignore for a warning that
# can no longer fire (CLAUDE.md > Code Architecture > "keep comments true" applies to
# suppressions too).
filterwarnings =
    error
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient
    ignore:.*_UnionGenericAlias.* is deprecated.*:DeprecationWarning:google\.genai\.types
