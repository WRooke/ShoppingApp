<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ShoppingApp</title>
  <!-- The server replaces __BUILD__ with the running build id (app/main.py > index()). The update
       banner compares this with /api/v1/health, and every asset URL below carries it so a new
       build is a new URL (see app/services/version.py). -->
  <meta name="app-build" content="__BUILD__" />
  <script>
    // Apply a saved theme choice before first paint, so there's never a flash of the wrong
    // theme. Written by Settings' "Appearance" section (settings-appearance.js). No choice
    // saved yet: a no-op, and the page follows the OS via prefers-color-scheme, same as
    // leaving the attribute unset. See tokens.css.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (_) {
        // localStorage can throw in a locked-down/private context — fall back to System.
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css?v=__BUILD__" />
  <link rel="stylesheet" href="/static/css/components.css?v=__BUILD__" />
  <link rel="stylesheet" href="/static/css/components-screens.css?v=__BUILD__" />
  <link rel="stylesheet" href="/static/css/app.css?v=__BUILD__" />
</head>
